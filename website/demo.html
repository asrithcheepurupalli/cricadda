    <!-- ============ TURF SCREEN ============ -->
    <div class="tv-shell">
      <div class="tv-label">🖥 THE TURF'S BIG SCREEN (BEHIND THE BOWLER)</div>
      <div class="tv" id="tv"></div>
      <div class="sensor-row">
        <button onclick="fireAuto('four')">🧱 SIMULATE BOUNDARY SENSOR → 4</button>
        <button class="gold" onclick="fireAuto('six')">📷 SIMULATE AI CAMERA → 6</button>
      </div>
      <div class="sensor-note">⚡ In a real install these fire from actual hardware on the boundary — here, you press the buttons.</div>

<script>
/* =====================================================================
   CricAdda in-browser demo — the same event-sourced engine as the
   production prototype, running fully client-side. Every ball is an
   event; the scoreboard is recomputed by replaying the log.
   ===================================================================== */
const CODE = String(Math.floor(1000 + Math.random() * 9000));
const room = { setup: null, events: [], pendingAuto: null, seq: 0 };
let paired = false;
let lastFxSeq = 0;

// ---------------- engine (ported from server.js) ----------------
function newInnings(batKey, bowlKey, setup, target) {
  return {
    batKey, bowlKey, target,
    runs: 0, wickets: 0, balls: 0, fours: 0, sixes: 0,
    batters: setup[batKey].players.map((name) => ({ name, runs: 0, balls: 0, out: false })),
    bowlers: [], striker: 0, nonStriker: 1, nextIn: 2,
    thisOver: [], currentBowler: null, done: false, endReason: null,
  };
}
function bowlerOf(inn) {
  const name = inn.currentBowler || 'Bowler';
  let b = inn.bowlers.find((x) => x.name === name);
  if (!b) { b = { name, balls: 0, runs: 0, wickets: 0 }; inn.bowlers.push(b); }
  return b;
}
function checkDone(inn, setup) {
  if (inn.wickets >= inn.batters.length - 1) { inn.done = true; inn.endReason = 'all out'; }
  else if (inn.balls >= setup.overs * 6) { inn.done = true; inn.endReason = 'overs completed'; }
  else if (inn.target && inn.runs >= inn.target) { inn.done = true; inn.endReason = 'target chased'; }
}
function applyBall(inn, ev, setup, fx) {
  const striker = inn.batters[inn.striker];
  const bw = bowlerOf(inn);
  let display, rotate = false;
  if (ev.extra === 'wd') { inn.runs += 1; bw.runs += 1; display = 'Wd'; }
  else if (ev.extra === 'nb') {
    inn.runs += 1 + ev.runs; bw.runs += 1 + ev.runs; striker.runs += ev.runs;
    display = ev.runs ? `Nb+${ev.runs}` : 'Nb'; rotate = ev.runs % 2 === 1;
    if (ev.runs === 4) { inn.fours++; fx.kind = 'four'; }
    if (ev.runs === 6) { inn.sixes++; fx.kind = 'six'; }
  } else {
    inn.balls += 1; bw.balls += 1; striker.balls += 1;
    if (ev.wicket) {
      inn.wickets += 1; bw.wickets += 1; striker.out = true; display = 'W';
      fx.kind = 'wicket'; fx.batterOut = `${striker.name} ${striker.runs} (${striker.balls})`;
      if (inn.nextIn < inn.batters.length) { inn.striker = inn.nextIn; inn.nextIn += 1; }
    } else {
      const before = striker.runs;
      striker.runs += ev.runs; inn.runs += ev.runs; bw.runs += ev.runs;
      display = String(ev.runs); rotate = ev.runs % 2 === 1;
      if (ev.runs === 4) { inn.fours++; fx.kind = 'four'; }
      else if (ev.runs === 6) { inn.sixes++; fx.kind = 'six'; }
      else fx.kind = ev.runs > 0 ? 'run' : 'dot';
      if (before < 50 && striker.runs >= 50) fx.milestone = { player: striker.name, mark: 50 };
    }
    fx.batter = striker.name;
  }
  inn.thisOver.push({ d: display, src: ev.source || 'manual' });
  if (rotate) [inn.striker, inn.nonStriker] = [inn.nonStriker, inn.striker];
  checkDone(inn, setup);
  if (!inn.done && inn.balls > 0 && inn.balls % 6 === 0 && ev.extra !== 'wd' && ev.extra !== 'nb') {
    [inn.striker, inn.nonStriker] = [inn.nonStriker, inn.striker];
    inn.currentBowler = null; inn.thisOver = [];
  }
}
function computeState() {
  if (!room.setup) return { phase: paired ? 'setup' : 'waiting', seq: room.seq };
  const setup = room.setup;
  const firstBat = setup.firstBatting, secondBat = firstBat === 'A' ? 'B' : 'A';
  const innings = [newInnings(firstBat, secondBat, setup, null)];
  let lastFx = null;
  for (const ev of room.events) {
    let inn = innings[innings.length - 1];
    if (inn.done && innings.length === 1) {
      innings.push(newInnings(secondBat, firstBat, setup, innings[0].runs + 1));
      inn = innings[1];
    }
    if (ev.type === 'setBowler') { if (!inn.done) inn.currentBowler = ev.name; }
    else if (ev.type === 'ball') {
      if (inn.done) continue;
      const fx = { seq: ev.seq, source: ev.source || 'manual' };
      applyBall(inn, ev, setup, fx);
      lastFx = fx;
    }
  }
  const inn = innings[innings.length - 1];
  let phase = 'live', result = null, mom = null;
  if (innings.length === 2 && inn.done) {
    phase = 'result';
    const first = innings[0], chase = inn;
    const tn = (k) => setup[k].name;
    if (chase.runs >= chase.target) {
      const w = chase.batters.length - 1 - chase.wickets;
      result = `${tn(chase.batKey)} won by ${w} wicket${w === 1 ? '' : 's'}`;
    } else if (chase.runs === chase.target - 1) result = 'Match tied!';
    else result = `${tn(first.batKey)} won by ${chase.target - 1 - chase.runs} runs`;
    const pts = new Map();
    const add = (n, p, line) => { const e = pts.get(n) || { p: 0, l: [] }; e.p += p; if (line) e.l.push(line); pts.set(n, e); };
    for (const i of innings) {
      for (const b of i.batters) if (b.balls > 0 || b.runs > 0) add(b.name, b.runs, `${b.runs} (${b.balls})`);
      for (const b of i.bowlers) if (b.balls > 0) add(b.name, b.wickets * 25, `${b.wickets}/${b.runs}`);
    }
    let best = null;
    for (const [n, e] of pts) if (!best || e.p > best.p) best = { name: n, p: e.p, summary: e.l.join(' & ') };
    if (best) mom = best;
  } else if (innings.length === 1 && inn.done) phase = 'innings_break';

  const ov = (b) => `${Math.floor(b / 6)}.${b % 6}`;
  const iv = (i) => ({
    battingTeam: setup[i.batKey].name, bowlingTeam: setup[i.bowlKey].name,
    runs: i.runs, wickets: i.wickets, overs: ov(i.balls), fours: i.fours, sixes: i.sixes,
    striker: i.batters[i.striker] && !i.batters[i.striker].out ? i.batters[i.striker] : null,
    nonStriker: i.batters[i.nonStriker] && !i.batters[i.nonStriker].out ? i.batters[i.nonStriker] : null,
    bowler: i.currentBowler ? { ...bowlerOf(i), overs: ov(bowlerOf(i).balls) } : null,
    thisOver: i.thisOver, target: i.target, needsBowler: !i.done && i.currentBowler === null,
    batters: i.batters, bowlers: i.bowlers, endReason: i.endReason,
  });
  const view = {
    phase, seq: room.seq, mom, result,
    setup: { teamA: setup.A.name, teamB: setup.B.name, overs: setup.overs },
    innings: innings.map(iv), inningsNo: innings.length, live: iv(inn),
    pendingAuto: room.pendingAuto, lastFx,
    bowlingTeamPlayers: setup[inn.bowlKey].players,
  };
  if (phase === 'live' && innings.length === 2) {
    const need = inn.target - inn.runs, bl = setup.overs * 6 - inn.balls;
    view.chase = { need, ballsLeft: bl, rrr: bl > 0 ? (need / (bl / 6)).toFixed(2) : '—' };
  }
  return view;
}

// ---------------- dispatch ----------------
function dispatch(ev) {
  room.seq += 1;
  if (ev.type === 'ball') { room.events.push({ ...ev, seq: room.seq }); room.pendingAuto = null; }
  else if (ev.type === 'setBowler') room.events.push({ ...ev, seq: room.seq });
  else if (ev.type === 'undo') {
    for (let i = room.events.length - 1; i >= 0; i--) if (room.events[i].type === 'ball') { room.events.splice(i, 1); break; }
  }
  else if (ev.type === 'auto') room.pendingAuto = { kind: ev.kind, runs: ev.kind === 'six' ? 6 : 4, device: ev.kind === 'six' ? 'Overhead camera' : 'Boundary sensor #2' };
  else if (ev.type === 'dismissAuto') room.pendingAuto = null;
  else if (ev.type === 'rematch') { room.events = []; room.pendingAuto = null; }
  render();
}

// ---------------- sound ----------------
let ac = null;
function tone(f, d, dl = 0, t = 'square', v = 0.1) {
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = t; o.frequency.value = f;
    g.gain.setValueAtTime(v, ac.currentTime + dl);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dl + d);
    o.connect(g); g.connect(ac.destination);
    o.start(ac.currentTime + dl); o.stop(ac.currentTime + dl + d);
  } catch (e) {}
}
const sounds = {
  four: () => { tone(523, 0.15); tone(659, 0.15, 0.12); tone(784, 0.3, 0.24); },
  six: () => { tone(523, 0.12); tone(659, 0.12, 0.1); tone(784, 0.12, 0.2); tone(1047, 0.5, 0.3); },
  wicket: () => { tone(311, 0.2, 0, 'sawtooth'); tone(233, 0.2, 0.18, 'sawtooth'); tone(155, 0.5, 0.36, 'sawtooth'); },
  milestone: () => { for (let i = 0; i < 4; i++) tone(784 + i * 100, 0.15, i * 0.1, 'triangle', 0.13); },
};

// ---------------- rendering ----------------
const esc = (s) => { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; };
const tv = document.getElementById('tv');
const phone = document.getElementById('phone');
let flashTimer = null;

function chipHtml(b, cls2 = '') {
  const cls = b.d === 'W' ? 'bw' : b.d === '4' ? 'b4' : b.d === '6' || b.d.startsWith('Nb+6') ? 'b6' : '';
  return `<span class="ball-chip ${cls}${b.src === 'sensor' ? ' sensor' : ''} ${cls2}">${esc(b.d)}</span>`;
}

function tvFlash(cls, big, sub, autotag) {
  const el = document.createElement('div');
  el.className = 'tv-flash show ' + cls;
  el.innerHTML = `<div class="big">${esc(big)}</div><div class="sub">${esc(sub || '')}</div>${autotag ? `<div class="autotag">⚡ AUTO-DETECTED BY ${esc(autotag)}</div>` : ''}`;
  const old = tv.querySelector('.tv-flash'); if (old) old.remove();
  tv.appendChild(el);
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => el.remove(), 2200);
}

function renderTV(st) {
  const bar = `<div class="bar"><span>CRIC<span style="color:var(--green)">ADDA</span></span>${st.phase === 'live' ? '<span class="b-live">● LIVE</span>' : ''}<span>CODE ${CODE}</span></div>`;
  if (st.phase === 'waiting' || st.phase === 'setup') {
    tv.innerHTML = bar + `
      <div class="tv-center">
        <div class="tv-code-label">PAIRING CODE — ENTER THIS ON THE PHONE →</div>
        <div class="tv-code">${CODE}</div>
        <div class="tv-hint">${st.phase === 'waiting' ? 'Waiting for a phone to pair. On a real turf this screen stands behind the bowler, facing the batsman.' : 'Phone paired! Setting up the match…'}</div>
      </div>`;
    return;
  }
  if (st.phase === 'innings_break' || st.phase === 'result') {
    const head = st.phase === 'result'
      ? `<div class="r">🏆 ${esc(st.result)}</div>${st.mom ? `<div class="mom">⭐ PLAYER OF THE MATCH: ${esc(st.mom.name)} — ${esc(st.mom.summary)}</div>` : ''}`
      : `<div class="r">INNINGS BREAK — ${esc(st.innings[0].bowlingTeam)} NEED ${st.innings[0].runs + 1}</div><div class="mom" style="color:var(--dim)">waiting for the scorer to pick the opening bowler…</div>`;
    const cards = st.innings.map((i) => {
      const bats = i.batters.filter((b) => b.balls > 0 || b.runs > 0 || b.out);
      const bowls = i.bowlers.filter((b) => b.balls > 0);
      return `<div class="tv-sc"><h5>${esc(i.battingTeam)} — ${i.runs}/${i.wickets} (${i.overs})</h5>
        <table>${bats.map((b) => `<tr><td>${esc(b.name)}${b.out ? ' †' : ''}</td><td class="n">${b.runs} (${b.balls})</td></tr>`).join('')}
        ${bowls.map((b) => `<tr><td style="color:var(--dim)">🎳 ${esc(b.name)}</td><td class="n" style="color:var(--dim)">${b.wickets}/${b.runs}</td></tr>`).join('')}</table></div>`;
    }).join('');
    tv.innerHTML = bar + `<div class="tv-result">${head}<div class="tv-sc-grid">${cards}</div></div>`;
    return;
  }
  const l = st.live;
  const chase = st.chase
    ? `<div class="tv-chase">TARGET ${l.target} · NEED ${st.chase.need} OFF ${st.chase.ballsLeft} · RRR ${st.chase.rrr}</div>`
    : `<div class="tv-chase" style="color:var(--dim)">INNINGS ${st.inningsNo} OF 2 · ${st.setup.overs} OVERS/SIDE</div>`;
  tv.innerHTML = bar + `
    <div class="tv-score-row"><span class="tv-team">${esc(l.battingTeam.toUpperCase())}</span>
      <span class="tv-runs">${l.runs}/${l.wickets}</span><span class="tv-ov">(${l.overs} ov)</span></div>
    ${chase}
    <div class="tv-grid">
      <div class="tv-panel">
        <div class="tv-sec">BATTING</div>
        ${l.striker ? `<div class="tv-prow"><span>${esc(l.striker.name)} <span class="st">*</span></span><span>${l.striker.runs} (${l.striker.balls})</span></div>` : ''}
        ${l.nonStriker ? `<div class="tv-prow"><span>${esc(l.nonStriker.name)}</span><span>${l.nonStriker.runs} (${l.nonStriker.balls})</span></div>` : ''}
        <div class="tv-sec" style="margin-top:5%">BOWLING</div>
        ${l.bowler ? `<div class="tv-prow"><span>${esc(l.bowler.name)}</span><span>${l.bowler.wickets}/${l.bowler.runs} (${l.bowler.overs})</span></div>` : `<div class="tv-prow" style="color:var(--dim)">selecting bowler…</div>`}
      </div>
      <div class="tv-panel">
        <div class="tv-sec">THIS OVER</div>
        <div class="tv-balls">${l.thisOver.map((b) => chipHtml(b)).join('') || '<span style="color:var(--dim);font-size:13px">new over</span>'}</div>
        <div class="tv-bound"><span style="color:var(--green)">${l.fours} × FOUR</span> · <span style="color:var(--gold)">${l.sixes} × SIX</span></div>
      </div>
    </div>
    <div class="tv-footer"><span>${esc(st.setup.teamA)} vs ${esc(st.setup.teamB)}</span><span>every ball logged · zero disputes</span></div>`;
}

function handleFx(st) {
  const fx = st.lastFx;
  if (!fx || fx.seq <= lastFxSeq) return;
  lastFxSeq = fx.seq;
  const tag = fx.source === 'sensor' ? (fx.kind === 'six' ? 'AI CAMERA' : 'BOUNDARY SENSOR') : null;
  if (fx.milestone) { tvFlash('fm', fx.milestone.mark + '!', `${fx.milestone.player} brings up a superb fifty!`); sounds.milestone(); }
  else if (fx.kind === 'four') { tvFlash('f4', 'FOUR!', `${fx.batter} finds the boundary`, tag); sounds.four(); }
  else if (fx.kind === 'six') { tvFlash('f6', 'SIX!', `${fx.batter} sends it over the net!`, tag); sounds.six(); }
  else if (fx.kind === 'wicket') { tvFlash('fw', 'OUT!', fx.batterOut || ''); sounds.wicket(); }
}

// ---------------- phone rendering ----------------
function renderPhone(st) {
  const head = `<div class="ph-notch"></div><div class="ph-head"><span class="t">CRIC<span>ADDA</span></span>
    <span class="badge ${paired ? 'auto' : 'live'}">${paired ? '● PAIRED ' + CODE : 'NOT PAIRED'}</span></div>`;

  if (!paired) {
    phone.innerHTML = head + `<div class="ph-step">
      <h4>PAIR WITH THE TURF SCREEN</h4>
      <p>Type the 4-digit code shown on the big screen ← and your phone becomes the remote.</p>
      <label>Pairing code</label>
      <input class="code-in" id="codeIn" inputmode="numeric" maxlength="4" placeholder="0000" autocomplete="off">
      <button class="primary" style="width:100%;margin-top:14px" onclick="tryPair()">CONNECT ▶</button>
      <small class="err" id="pairErr"></small>
    </div>`;
    return;
  }
  if (st.phase === 'setup') {
    phone.innerHTML = head + `<div class="ph-step">
      <h4>MATCH SETUP</h4>
      <div class="field-row">
        <div><label>Team A</label><input id="tA" value="Royal Strikers"></div>
        <div><label>Team B</label><input id="tB" value="Turf Titans"></div>
      </div>
      <label>Overs per side</label>
      <select id="ovs"><option>1</option><option selected>2</option><option>4</option><option>6</option></select>
      <p style="margin-top:10px">Players are pre-filled for the demo. In the real app your saved squads appear here.</p>
      <button class="primary" style="width:100%;margin-top:14px" onclick="startMatch()">START MATCH ▶</button>
    </div>`;
    return;
  }

  const l = st.live;
  let body = `<div class="ph-score">
      <div class="t">${esc(l.battingTeam)} batting · inn ${st.inningsNo}/2</div>
      <div class="r">${l.runs}/${l.wickets} <span style="font-size:13px;color:var(--dim)">(${l.overs})</span></div>
      ${st.chase ? `<div class="chase">NEED ${st.chase.need} OFF ${st.chase.ballsLeft}</div>` : ''}
    </div>
    <div class="ph-bats">
      ${l.striker ? `<span><b>${esc(l.striker.name)}*</b> ${l.striker.runs}(${l.striker.balls})</span>` : ''}
      ${l.nonStriker ? `<span>${esc(l.nonStriker.name)} ${l.nonStriker.runs}(${l.nonStriker.balls})</span>` : ''}
      ${l.bowler ? `<span>🎳 ${esc(l.bowler.name)} ${l.bowler.wickets}/${l.bowler.runs}</span>` : ''}
    </div>
    <div class="mini-balls">${l.thisOver.map((b) => chipHtml(b)).join('')}</div>`;

  const p = st.pendingAuto;
  if (p && st.phase === 'live') {
    body += `<div class="auto-banner show">
      <div class="tag">⚡ AUTO-DETECTED · ${esc(p.device.toUpperCase())}</div>
      <div class="what">${p.kind === 'six' ? 'SIX — ball cleared the net line' : 'FOUR — ball hit the boundary'}</div>
      <div class="row"><button class="primary" onclick="confirmAuto(true)">✓ CONFIRM</button>
      <button onclick="confirmAuto(false)">✕ IGNORE</button></div>
    </div>`;
  }

  if (st.phase === 'live' && l.needsBowler) {
    body += `<div class="ph-step" style="margin-top:12px"><h4>SELECT BOWLER</h4><div class="bowler-pick">
      ${st.bowlingTeamPlayers.map((n) => `<button onclick="dispatch({type:'setBowler',name:'${esc(n).replace(/'/g, "\\'")}'})">🎳 ${esc(n)}</button>`).join('')}
    </div></div>`;
  } else if (st.phase === 'live') {
    body += `<div class="pad">
      <button onclick="ball(0)">0</button><button onclick="ball(1)">1</button>
      <button onclick="ball(2)">2</button><button onclick="ball(3)">3</button>
      <button class="b4" onclick="ball(4)">4</button><button class="b6" onclick="ball(6)">6</button>
      <button class="sm" onclick="dispatch({type:'ball',runs:0,extra:'wd'})">WIDE</button>
      <button class="sm" onclick="dispatch({type:'ball',runs:0,extra:'nb'})">NO BALL</button>
      <button class="bw" onclick="dispatch({type:'ball',runs:0,wicket:true})">WICKET</button>
      <button class="sm" onclick="ball(5)">5</button>
      <button class="sm" onclick="dispatch({type:'undo'})">↩ UNDO</button>
    </div>`;
  }

  if (st.phase === 'innings_break') {
    const i1 = st.innings[0];
    body += `<div class="ph-step" style="margin-top:12px">
      <h4>INNINGS OVER — ${esc(i1.bowlingTeam.toUpperCase())} NEED ${i1.runs + 1}</h4>
      <div class="bowler-pick">
      ${st.bowlingTeamPlayers.map((n) => `<button onclick="dispatch({type:'setBowler',name:'${esc(n).replace(/'/g, "\\'")}'})">🎳 ${esc(n)}</button>`).join('')}
      </div></div>`;
  }
  if (st.phase === 'result') {
    body += `<div class="ph-result">
      <div class="r">🏆 ${esc(st.result)}</div>
      ${st.mom ? `<div class="mom">⭐ Player of the Match: ${esc(st.mom.name)} — ${esc(st.mom.summary)}</div>` : ''}
      <button class="gold" style="width:100%" onclick="dispatch({type:'rematch'})">🔁 REMATCH</button>
    </div>`;
  }
  phone.innerHTML = head + body;
}

function render() {
  const st = computeState();
  renderTV(st);
  renderPhone(st);
  handleFx(st);
}

// ---------------- actions ----------------
function tryPair() {
  const v = document.getElementById('codeIn').value.trim();
  if (v !== CODE) { document.getElementById('pairErr').textContent = `Wrong code — the screen says ${CODE}.`; return; }
  paired = true;
  render();
}
function startMatch() {
  const overs = parseInt(document.getElementById('ovs').value, 10) || 2;
  room.setup = {
    A: { name: document.getElementById('tA').value.trim() || 'Team A', players: ['Asrith', 'Tarun', 'Chandesh', 'Vamsi', 'Kiran'] },
    B: { name: document.getElementById('tB').value.trim() || 'Team B', players: ['Partha', 'Rohit', 'Suresh', 'Deepak', 'Ravi'] },
    overs, firstBatting: 'A',
  };
  room.events = []; room.pendingAuto = null; room.seq += 1;
  render();
}
function ball(runs) { dispatch({ type: 'ball', runs }); }
function fireAuto(kind) {
  const st = computeState();
  if (st.phase !== 'live') return;
  dispatch({ type: 'auto', kind });
}
function confirmAuto(ok) {
  const p = room.pendingAuto;
  if (!p) return;
  if (ok) dispatch({ type: 'ball', runs: p.runs, source: 'sensor' });
  else dispatch({ type: 'dismissAuto' });
}

render();
</script>
</body>
</html>
